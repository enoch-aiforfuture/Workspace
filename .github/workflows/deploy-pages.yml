name: Deploy GitHub Pages

# Pages is optional. configure-pages fails the job (and emails) with
# "Get Pages site failed ... Not Found" when the repo has no Pages site.
# Probe the API first and skip the build and deploy when it is off.
# Enabling Pages is a repo-admin setting (Settings → Pages → GitHub Actions);
# this workflow does not turn it on.

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages-enabled:
    name: Check GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          http_code="$(curl -sS -o /tmp/pages-site.json -w '%{http_code}' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "$http_code" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is enabled; packaging and deploying the site."
          elif [ "$http_code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GitHub Pages is not enabled for ${GITHUB_REPOSITORY} (GET /pages returned 404)."
            echo "Skipping the site build and deploy so this workflow does not fail."
            echo "An owner can enable it under Settings → Pages → Build and deployment → GitHub Actions, then re-run this workflow."
          else
            echo "GET /pages returned HTTP ${http_code}; not treating that as Pages being off." >&2
            cat /tmp/pages-site.json >&2 || true
            exit 1
          fi

  build:
    name: Package static site
    needs: pages-enabled
    if: "needs.pages-enabled.outputs.enabled == 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697  # v1.0.13
        with:
          source: website
          destination: _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy static site
    needs: [pages-enabled, build]
    # An explicit if replaces the implicit success() check. Require the
    # package job to have succeeded so a failed build cannot still deploy,
    # and so a skipped build (Pages off) does not deploy either.
    if: "needs.pages-enabled.outputs.enabled == 'true' && needs.build.result == 'success'"
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
